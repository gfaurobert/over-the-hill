# Deploys to main server on push to main.
# Secrets: DEMO_SSH_HOST, DEMO_SSH_USER, DEMO_SSH_PRIVATE_KEY, DEMO_SERVER_PROJECT_DIR, DEMO_GH_TOKEN (PAT with repo read), DEMO_PNPM_PATH (optional, full path to pnpm on server), DEMO_SSH_PORT (optional, if not 22)

name: Deploy to main

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build oth
        run: pnpm build
      
      - name: Run unit tests
        run: pnpm test:unit

  deploy:
    runs-on: ubuntu-latest
    needs: [build]
    env:
      SERVER_PROJECT_DIR: ${{ secrets.OTH_PROJECT_DIR }}
      GH_TOKEN: ${{ secrets.OTH_GH_TOKEN }}
      PNPM_CMD: ${{ secrets.OTH_PNPM_PATH }}
    steps:
      - name: Deploy to Faurobert server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.OTH_SSH_HOST }}
          username: ${{ secrets.OTH_SSH_USER }}
          key: ${{ secrets.OTH_SSH_PRIVATE_KEY }}
          port: ${{ secrets.OTH_SSH_PORT || '22' }}
          envs: SERVER_PROJECT_DIR,GH_TOKEN,GITHUB_REPOSITORY,PNPM_CMD
          script: |
            set -e
            if [ -z "$PNPM_CMD" ]; then
              [ -f "$HOME/.zshrc" ] && . "$HOME/.zshrc"
              [ -f "$HOME/.bashrc" ] && . "$HOME/.bashrc"
              [ -f "$HOME/.profile" ] && . "$HOME/.profile"
              PNPM_CMD=pnpm
            else
              # pnpm is often a symlink to a .js file (e.g. corepack); ensure target is executable and node is on PATH
              PNPM_DIR="$(cd "$(dirname "$PNPM_CMD")" && pwd)"
              export PATH="$PNPM_DIR:$PATH"
              [ -f "$PNPM_CMD" ] && chmod +x "$PNPM_CMD" 2>/dev/null || true
              REAL_PNPM="$(readlink -f "$PNPM_CMD" 2>/dev/null || realpath "$PNPM_CMD" 2>/dev/null || echo "$PNPM_CMD")"
              [ -f "$REAL_PNPM" ] && chmod +x "$REAL_PNPM" 2>/dev/null || true
            fi
            cd "$SERVER_PROJECT_DIR"
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            "$PNPM_CMD" install --frozen-lockfile
            if [ -f deploy/release-actions.sh ]; then
              chmod +x deploy/release-actions.sh
              ./deploy/release-actions.sh
            fi
            if [ -f supabase/scripts/runMigrations.sh ]; then
              chmod +x supabase/scripts/runMigrations.sh
              ./supabase/scripts/runMigrations.sh
            fi
            "$PNPM_CMD" build && pm2 restart ecosystem.config.js     
            